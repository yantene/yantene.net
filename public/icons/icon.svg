<!--
  アイコンの素材: やんてねくんの顔のアップ。

  app/frontend/assets/yantene-character.svg から viewBox だけで切り出したもの。
  あちらは master から起こした生成物なので触らない。作り直す手順は次のとおり。

  1. yantene-character.svg の中身を写す。**白の裏打ち (1 枚目) とインク (2 枚目) の
     2 枚だけでよい。** 残り (胸の前のノートパソコン) はこの viewBox の外にあり、
     入れても 1 px も変わらないことを確かめてある
  2. viewBox を "52 36 70 70" にする。元の座標系のまま頭部だけを覗く
  3. fill を currentColor から #1a2740 に変える。favicon や <img> として
     単独で読まれると currentColor の行き先が無く、黒に落ちるため。色は
     app.css の base-content (地の文のインク) と同じ
  4. viewBox いっぱいの <rect> を敷く。manifest.webmanifest が icon-512.png を
     purpose: maskable でも使っており、角が透けるとランチャーの下地が出る

  ⚠️ **窓に入る要素は素材を差し替えるたびに測り直すこと。** 2 枚で足りるのは
  いまの絵がそうだというだけで、決めごとではない。

  この 1 枚から scripts/generate-icons.sh が png と favicon.ico を起こす。
  差し替えたら必ず走らせること (生成物もリポジトリに入れてある)。
-->
