<!--
  歩行者。手元の pedestrian.svg (Inkscape) から書き出したもので、直接は編集しない。
  描き直すときは pedestrian.svg を直し、Inkscape の作業用属性を落とし、線の色を
  currentColor に、線の太さは持たせない形にして書き出す。

  - viewBox の下端が接地面。地平線 (街の viewBox の下端) にこの下端を合わせて立たせる。
  - 進行方向は右向き。時間を巻き戻しているあいだは CSS の scaleX(-1) で反転させる。
  - 輪郭は currentColor で受け、線の太さは持たない (CSS が画面上の太さを決める)。
  - 要素の並びが絵の前後関係 (奥の腕 → 胴 → 手前の腕) なので、順序は入れ替えないこと。
  - 手足は個別には動かさない。歩いている姿勢が描かれているので、全体をゆっくり
    傾けるだけにしている。
-->
