<!--
歩行者。手元の pedestrian.svg (Inkscape) から書き出したもので、直接は編集しない。
  描き直すときは pedestrian.svg を直し、線の色を currentColor に置き換えて書き出す。

  - viewBox の下端が接地面。地平線 (街の viewBox の下端) にこの下端を合わせて立たせる。
  - 進行方向は右向き。時間を巻き戻しているあいだは CSS の scaleX(-1) で反転させる。
  - 腕・脚・胴などがレイヤーに分かれているが、動かしてはいない。歩いている姿勢が
    最初から描かれているので、そのまま静止して置く。要素の並びが絵の前後関係
    (奥の腕 → 胴 → 手前の腕) なので、順序は入れ替えないこと。
-->
