<!--
  Roadside objects for the footer.

  Deliberately sparse: a lamp, a pole, a sign. The footer is where a page ends,
  not another place to show the town, so this is placed once at each edge rather
  than tiled. The horizon itself is drawn in CSS so it can span any width without
  stretching these shapes.

  The stroke colour is baked in (#9488d3, the same ink as the cityscape) because
  this file is referenced from CSS as a background image, and a background image
  cannot inherit currentColor from the page.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" fill="none" stroke="#9488d3" stroke-width="1" vector-effect="non-scaling-stroke">
  <!-- street lamp -->
  <g id="street-lamp">
    <path d="M24 64 V22" />
    <path d="M24 22 q0 -7 9 -7 h7" />
    <path d="M36 15 h8 l-2 6 h-4 z" />
  </g>

  <!-- utility pole with two crossarms -->
  <g id="utility-pole">
    <path d="M108 64 V10" />
    <path d="M97 20 H119" />
    <path d="M99 29 H117" />
  </g>

  <!-- road sign -->
  <g id="road-sign">
    <path d="M196 64 V34" />
    <circle cx="196" cy="27" r="6" />
  </g>
</svg>
