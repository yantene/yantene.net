<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1920 340"
  role="img"
  aria-hidden="true"
>
  <!--
    街並みの線画 (プレースホルダ)。中身は半透明の矩形だけで、形は本番素材で差し替える。

    差し替え時に守る取り決め。

    - viewBox は "0 0 1920 340" を維持する。使う側はこの比率をそのままコンテナの
      aspect-ratio に写して敷くので、比率が変わると街の高さが変わる。
    - 地平線は viewBox の下端 (y=340) そのもの。建物・木・塔はすべてこの線に接地させ、
      線より下には何も描かないこと。歩行者はこの線の上に立ち、時刻の目盛り軸は
      この線の下に置かれる。
    - 背景の矩形は置かない。背後の Celestim (空) が透けなくなる。
    - 色は fill="currentColor" で受ける。時間帯に応じた濃さは CSS 側 (color / opacity) が決める。
      SVG 内に色を直書きすると空の色と喧嘩する。
    - 雲は <g id="clouds-set"> の中だけに描く。左端と右端にまたがる雲を置かないこと
      (すぐ下の複製と重なって継ぎ目が出る)。
    - <use> による複製と、それを囲む <g id="clouds"> はそのまま残す。CSS が #clouds を
      1920 だけ左へ動かし、複製が元の位置に来たところで振り出しに戻ることで、
      雲が途切れずに流れ続ける。複製を消すと右端から雲が消えて空になる。
    - 建物・木・塔は <g id="skyline"> に入れる。こちらは固定で流れない。
  -->

  <g id="clouds" fill="currentColor" fill-opacity="0.1">
    <g id="clouds-set">
      <rect x="120" y="60" width="180" height="34" rx="17" />
      <rect x="170" y="42" width="90" height="30" rx="15" />
      <rect x="330" y="120" width="140" height="28" rx="14" />
      <rect x="760" y="70" width="200" height="36" rx="18" />
      <rect x="820" y="50" width="100" height="32" rx="16" />
      <rect x="1180" y="96" width="160" height="30" rx="15" />
      <rect x="1230" y="78" width="80" height="28" rx="14" />
      <rect x="1520" y="54" width="150" height="32" rx="16" />
    </g>
    <use href="#clouds-set" x="1920" />
  </g>

  <g id="skyline" fill="currentColor" fill-opacity="0.14">
    <!-- 左端の木立 -->
    <rect x="26" y="252" width="52" height="52" rx="20" />
    <rect x="48" y="296" width="8" height="44" />
    <rect x="96" y="268" width="44" height="44" rx="18" />
    <rect x="114" y="304" width="8" height="36" />

    <!-- 左の橋 -->
    <rect x="30" y="286" width="196" height="6" />
    <rect x="58" y="286" width="6" height="54" />
    <rect x="130" y="240" width="6" height="100" />
    <rect x="200" y="286" width="6" height="54" />

    <!-- ビル群 (左) -->
    <rect x="252" y="196" width="86" height="144" />
    <rect x="348" y="238" width="62" height="102" />
    <rect x="420" y="168" width="74" height="172" />
    <rect x="504" y="252" width="96" height="88" />
    <rect x="610" y="222" width="58" height="118" />

    <!-- 低い街並み (中央) -->
    <rect x="686" y="288" width="120" height="52" />
    <rect x="816" y="272" width="84" height="68" />
    <rect x="910" y="296" width="106" height="44" />

    <!-- ビル群 (右) -->
    <rect x="1032" y="204" width="78" height="136" />
    <rect x="1120" y="256" width="64" height="84" />
    <rect x="1194" y="180" width="90" height="160" />
    <rect x="1294" y="244" width="70" height="96" />
    <rect x="1374" y="212" width="82" height="128" />

    <!-- 塔 (スカイツリー相当) -->
    <rect x="1568" y="44" width="18" height="296" />
    <rect x="1552" y="150" width="50" height="10" />
    <rect x="1560" y="196" width="34" height="8" />

    <!-- 右端の木立 -->
    <rect x="1700" y="264" width="48" height="48" rx="19" />
    <rect x="1720" y="304" width="8" height="36" />
    <rect x="1800" y="248" width="56" height="56" rx="22" />
    <rect x="1824" y="296" width="8" height="44" />
  </g>
</svg>
