version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      # ESLint 10 は eslint-plugin-react が未対応 (context.getFilename 削除に伴う破壊)。
      # 対応プラグインが揃うまでメジャー更新を保留する。
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 は typescript-eslint が未対応。eslint が設定を読む前に
      # "typescript-eslint does not support TS 7.0" で落ちるため、lint が一切できなくなる。
      # 対応版が出るまでメジャー更新を保留する。
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
