version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      # TypeScript のメジャー更新は保留する。型を見る lint は oxlint-tsgolint が
      # 担っており、そちらが新しい TS に追随できているかを人が確かめてから上げる。
      # (以前の保留理由は typescript-eslint の未対応だったが、ADR 0027 で
      #  ESLint ごと外したので前提が変わった。追随の確認自体は引き続き要る)
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
